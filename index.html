<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080b14">
<meta name="description" content="Six interactive physics stations where the maths is the controller. Built for an edutainment fair.">
<meta name="color-scheme" content="dark">

<!-- Runs full screen when saved to a tablet home screen, which is how it should
     be set up on the stand: no browser chrome for a child to wander into. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Physics Playground">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23080b14'/><path d='M12 78 Q50 6 88 78' stroke='%23ffd23f' stroke-width='9' fill='none' stroke-linecap='round'/><circle cx='88' cy='78' r='9' fill='%2322d3ee'/></svg>">

<title>Physics Playground</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="stage">
  <canvas id="canvas"></canvas>

  <header id="hud" class="is-hidden">
    <button id="backBtn" class="icon-btn is-hidden" type="button" aria-label="Back">
      <span aria-hidden="true">←</span>
    </button>
    <div id="titleBlock">
      <h1 id="stationTitle"></h1>
      <p id="goal"></p>
      <p id="hint"></p>
    </div>
    <div id="hudRight">
      <div id="starRow"></div>
      <div id="scoreChip" class="is-hidden"></div>
    </div>
  </header>

  <aside id="mathPanel" class="is-hidden" aria-label="Live equations"></aside>
  <div id="controls" class="is-hidden"></div>
  <div id="overlay" class="is-empty"></div>
</div>

<noscript>
  <div class="noscript">
    <h1>Physics Playground</h1>
    <p>This stand is a JavaScript application. Please enable JavaScript to run it.</p>
  </div>
</noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
